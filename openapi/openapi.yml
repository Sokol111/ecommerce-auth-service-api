openapi: 3.0.0
info:
  title: Auth API
  version: 1.0.1
  description: |
    Authentication and Authorization API for E-commerce platform.
    Supports admin panel users with RBAC.
    Uses PASETO tokens for secure authentication.

paths:
  # ===========================================================================
  # Admin Authentication
  # ===========================================================================
  /v1/admin/login:
    post:
      summary: Admin user login
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Account disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/me:
    get:
      summary: Get current admin user profile
      operationId: adminGetProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/password/change:
    post:
      summary: Change admin user password
      operationId: adminChangePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized or wrong current password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ===========================================================================
  # Admin User Management (requires super_admin or user_manager role)
  # ===========================================================================
  /v1/admin/users/create:
    post:
      summary: Create a new admin user
      operationId: adminUserCreate
      security:
        - BearerAuth: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateRequest"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Email already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/users/update:
    put:
      summary: Update an admin user
      operationId: adminUserUpdate
      security:
        - BearerAuth: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Admin user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/users/get/{id}:
    get:
      summary: Get admin user by ID
      operationId: adminUserGetById
      security:
        - BearerAuth: [users:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Admin user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/users/list:
    get:
      summary: List admin users with pagination
      operationId: adminUserList
      security:
        - BearerAuth: [users:read]
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdminRole"
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Search by name or email
      responses:
        "200":
          description: List of admin users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/users/disable/{id}:
    post:
      summary: Disable an admin user
      operationId: adminUserDisable
      security:
        - BearerAuth: [users:delete]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User disabled
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden - cannot disable yourself or super_admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/admin/users/enable/{id}:
    post:
      summary: Enable an admin user
      operationId: adminUserEnable
      security:
        - BearerAuth: [users:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User enabled
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ===========================================================================
  # Token Management
  # ===========================================================================
  /v1/token/refresh:
    post:
      summary: Refresh access token using refresh token
      operationId: tokenRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ===========================================================================
  # Roles & Permissions (informational)
  # ===========================================================================
  /v1/roles:
    get:
      summary: Get all available roles
      operationId: getRoles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/permissions:
    get:
      summary: Get all available permissions
      operationId: getPermissions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: PASETO token in Authorization header

  schemas:
    # =========================================================================
    # Enums
    # =========================================================================
    AdminRole:
      type: string
      enum:
        - super_admin
        - catalog_manager
        - viewer
      description: |
        Admin user roles:
        - super_admin: Full access to all resources
        - catalog_manager: Can manage products, categories and attributes
        - viewer: Read-only access

    Permission:
      type: string
      enum:
        # User management
        - users:read
        - users:write
        - users:delete
        # Products
        - products:read
        - products:write
        - products:delete
        # Categories
        - categories:read
        - categories:write
        - categories:delete
        # Attributes
        - attributes:read
        - attributes:write
        - attributes:delete

    # =========================================================================
    # Auth Schemas
    # =========================================================================
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@example.com"
          maxLength: 255
        password:
          type: string
          format: password
          example: "SecureP@ss123"
          maxLength: 72

    AdminAuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
        - user
      properties:
        accessToken:
          type: string
          description: PASETO access token
        refreshToken:
          type: string
          description: Refresh token for obtaining new access tokens
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 900
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: "#/components/schemas/AdminUserProfile"

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 72
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Must contain at least 8 characters

    # =========================================================================
    # Admin User Schemas
    # =========================================================================
    AdminUserProfile:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - permissions
        - enabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/AdminRole"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Effective permissions based on role
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    AdminUserCreateRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/AdminRole"

    AdminUserUpdateRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/AdminRole"

    AdminUserResponse:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - enabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    AdminUserListResponse:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    # =========================================================================
    # Token Schemas
    # =========================================================================
    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The refresh token

    TokenRefreshResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: New refresh token (token rotation)
        expiresIn:
          type: integer
          example: 900

    # =========================================================================
    # Roles & Permissions Schemas
    # =========================================================================
    RoleInfo:
      type: object
      required:
        - name
        - description
        - permissions
      properties:
        name:
          $ref: "#/components/schemas/AdminRole"
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RolesResponse:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"

    PermissionInfo:
      type: object
      required:
        - name
        - description
        - resource
      properties:
        name:
          $ref: "#/components/schemas/Permission"
        description:
          type: string
        resource:
          type: string
          example: "products"

    PermissionsResponse:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionInfo"

    # =========================================================================
    # Error Schemas
    # =========================================================================
    Problem:
      type: object
      description: RFC7807 Problem Details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: "https://api.example.com/errors/validation"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "The request body contains invalid data"
        instance:
          type: string
          format: uri
        traceId:
          type: string
          example: "abc123"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email format"
